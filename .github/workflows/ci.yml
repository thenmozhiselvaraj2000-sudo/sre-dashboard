name: SRE Dashboard CI

on:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check HTML file
        run: |
          test -f index.html
          echo "index.html exists"

      - name: CI Success
        run: echo "SRE Dashboard CI completed successfully"

      - name: Build Docker image
        run: docker build -t sre-dashboard:latest .

      - name: Build successful
        run: echo "Docker image built successfully!"

